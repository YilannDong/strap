name: evaluate

# Component-lifecycle radar. Runs automatically so the system does the noticing:
#  • on every PR — scoped to what the PR ships (`--since` the base branch), posted
#    as a single sticky comment on the PR (updated in place, never piled up)
#  • weekly — a full sweep, to the run's job summary
#  • on demand — workflow_dispatch
# It only PROPOSES (promotions + retirements); a human decides.
on:
  pull_request:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # to post/update the PR comment

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so --since and recency dating work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Zero-dependency engine — no install step.
      - name: Component-lifecycle report
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=0 || true
            node scripts/strap.mjs evaluate --since "origin/${{ github.base_ref }}" --md | tee report.md >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/strap.mjs evaluate --md | tee report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post / update the sticky PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- strap-evaluate -->';
            const body = `${marker}\n` + fs.readFileSync('report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
